<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #fff;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    #instagramMock {
      background: url('https://www.instagram.com/static/images/homepage/home-phones.png/43cc71bb1b43.png') center no-repeat;
      background-size: contain;
      width: 90%;
      max-width: 450px; /* Instagram sayfası görünümü için uygun genişlik */
      height: 80%;
      margin: auto;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
      animation: fadeIn 1s ease-in-out;
    }

    #hackedScreen {
      display: none;
      background-color: black;
      color: red;
      font-family: monospace;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .warning {
      font-size: 30px;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0 }
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* Mobil uyumluluğu artıran CSS */
    @media (max-width: 600px) {
      #instagramMock {
        width: 95%;
        height: 70%;
      }
    }
  </style>
</head>
<body>

  <div id="instagramMock"></div>

  <div id="hackedScreen">
    <h1 class="warning">⚠️ İPHONE CİHAZINIZ RİSK ALTINDA ⚠️</h1>
    <p style="margin-top: 20px;">⚠️ Şüpheli sayfa ⚠️</p>
  </div>

  <script>
    setTimeout(() => {
      document.getElementById('instagramMock').style.display = 'none';
      document.getElementById('hackedScreen').style.display = 'flex';
    }, 5000);

    setTimeout(() => {
      alert("Error 143 Codes");
    }, 8000);
  </script>

</body>
</html>
