<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone Hacklendi</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: black;
      color: red;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
    }
    .warning {
      font-size: 24px;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      from, to { opacity: 1 }
      50% { opacity: 0 }
    }
  </style>
</head>
<body>
  <h1 class="warning">⚠️ iPhone Verileriniz Aktarılıyor ⚠️</h1>
  <p>Verileriniz dışa aktarılıyor...</p>
  <p>Lütfen bekleyin...</p>

  <script>
    setTimeout(() => {
      alert("İPHONE U YENİDEN BAŞLAT");
    }, 5000);
  </script>
</body>
</html>
