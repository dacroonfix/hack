<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone Hacklendi</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: black;
      color: red;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
    }
    .warning {
      font-size: 26px;
      animation: blink 1s step-end infinite;
    }
    .message {
      font-size: 18px;
      margin-top: 20px;
    }
    @keyframes blink {
      from, to { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <h1 class="warning">⚠️ iPhone Hacklendi! ⚠️</h1>
  <p class="message" id="msg">Verileriniz dışa aktarılıyor...</p>

  <script>
    const msg = document.getElementById('msg');

    setTimeout(() => {
      msg.textContent = "İletişim geçmişi indiriliyor...";
    }, 2000);

    setTimeout(() => {
      msg.textContent = "Fotoğraflar yedekleniyor...";
    }, 4000);

    setTimeout(() => {
      msg.textContent = "iCloud şifreleri analiz ediliyor...";
    }, 6000);

    setTimeout(() => {
      msg.textContent = "Tüm veriler başarıyla bilgisayara kaydedildi.";
    }, 8000);

    setTimeout(() => {
      alert("Şaka! Merak etme, hiçbir şey kaydedilmedi 😄");
      msg.textContent = "Şaka yaptım 😁 Cihazına hiçbir şey olmadı.";
    }, 10000);
  </script>
</body>
</html>
